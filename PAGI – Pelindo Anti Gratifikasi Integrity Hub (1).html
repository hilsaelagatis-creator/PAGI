<style>
:root{--blue:#0B5DA7;--blue2:#1677D2;--navy:#0A2A5E;--sky:#E8F2FC;--sky2:#F4F8FD;--line:#E3EAF3;--ink:#0F1E36;--muted:#62728A;
--green:#15803D;--greenbg:#E6F5EB;--orange:#C2410C;--orangebg:#FFF0E2;--red:#C81E1E;--redbg:#FDE8E8;--gray:#475569;--graybg:#EEF2F6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:#D6E1EE;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
#app{max-width:430px;margin:0 auto;height:100dvh;background:var(--sky2);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 50px rgba(10,42,94,.18)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:28px}
.top{background:#fff;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-shrink:0}
.top h1{font-size:16px;font-weight:700;flex:1;letter-spacing:-.2px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:none;background:var(--sky);color:var(--blue);display:grid;place-items:center;cursor:pointer;position:relative;flex-shrink:0}
.dot{position:absolute;top:6px;right:7px;min-width:9px;height:9px;border-radius:9px;background:var(--red);border:2px solid #fff}
.nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));flex-shrink:0}
.nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;font-size:11px;color:#8A98AD;padding:5px 0;cursor:pointer}
.nav button.on{color:var(--blue)}
.pad{padding:16px}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 12px rgba(10,42,94,.05);border:1px solid var(--line)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.h2{font-size:15px;font-weight:700;letter-spacing:-.2px}
.sec{font-size:13px;font-weight:700;color:var(--navy);margin:20px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sec a{font-size:12px;color:var(--blue);font-weight:600;cursor:pointer}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.b{font-weight:700}
.btn{border:none;border-radius:14px;padding:13px 16px;font-weight:700;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;transition:transform .05s}
.btn:active{transform:scale(.98)}
.btn.sec2{background:var(--sky);color:var(--blue)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--line)}
.btn.green{background:var(--green)}.btn.orange{background:#EA7A12}.btn.red{background:var(--red)}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:11px;width:auto}
.btns{display:flex;gap:10px}.btns>*{flex:1}
label.f{display:block;margin-top:14px}
label.f>span{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:6px}
label.f>span i{color:var(--red);font-style:normal}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;outline:none}
.in:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(22,119,210,.12)}
textarea.in{min-height:92px;resize:vertical}
.err .in{border-color:var(--red)}
.errt{color:var(--red);font-size:11.5px;margin-top:5px;font-weight:500}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--navy)}
.chip.on,.opt input:checked+.chip{background:var(--blue);border-color:var(--blue);color:#fff}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt{position:relative}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.g{background:var(--greenbg);color:var(--green)}.o{background:var(--orangebg);color:var(--orange)}.r{background:var(--redbg);color:var(--red)}.bl{background:var(--sky);color:var(--blue)}.gr{background:var(--graybg);color:var(--gray)}.nv{background:#E3E8F7;color:var(--navy)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.item .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.ttl{font-weight:700;font-size:13.5px;line-height:1.3}
.sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.toast{position:absolute;left:16px;right:16px;bottom:90px;background:var(--navy);color:#fff;padding:12px 14px;border-radius:14px;font-size:13px;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .25s ease}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.ov{position:absolute;inset:0;background:rgba(10,30,60,.45);z-index:40;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88%;overflow:auto;animation:up .25s ease}
.demo{background:#FFF8E6;border:1px solid #F6DFA3;color:#7A5300;border-radius:12px;padding:10px 12px;font-size:11.5px;line-height:1.45}
.info{background:var(--sky);border-radius:12px;padding:11px 12px;font-size:12px;color:var(--navy);line-height:1.45}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:none}.kv span:first-child{color:var(--muted)}.kv span:last-child{font-weight:600;text-align:right}
.tl{position:relative;padding-left:22px}
.tl .st{position:relative;padding-bottom:16px}
.tl .st:before{content:'';position:absolute;left:-17px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px var(--sky)}
.tl .st:after{content:'';position:absolute;left:-13px;top:16px;bottom:-2px;width:2px;background:var(--line)}
.tl .st:last-child:after{display:none}
.thumb{width:100%;max-height:200px;object-fit:cover;border-radius:14px;margin-top:10px;display:block}
.drop{border:1.5px dashed #B9C9DD;border-radius:14px;padding:16px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;background:#fff;display:block}
.drop input{display:none}
/* splash & login */
.splash{position:relative;flex:1;background:linear-gradient(160deg,#0A2A5E 0%,#0B5DA7 60%,#1E88E5 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.logo{width:84px;height:84px;border-radius:26px;background:#fff;display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.logo b{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-1px}
.logo b em{font-style:normal;color:var(--blue2)}
.logocard{background:#fff;border-radius:22px;padding:18px 22px;box-shadow:0 14px 34px rgba(0,0,0,.22);display:inline-block}
.logocard img{display:block;width:240px;max-width:68vw;height:auto}
.logochip{background:#fff;border-radius:14px;padding:8px 12px;display:inline-flex;align-items:center}
.logochip img{height:34px;width:auto;display:block}
.markbox{width:42px;height:42px;border-radius:13px;background:#fff;display:grid;place-items:center;flex-shrink:0}
.markbox img{width:32px;height:32px}
.pelw{height:18px;width:auto;display:block;opacity:.95}
.tag{letter-spacing:2.5px;font-weight:700;font-size:11.5px;opacity:.9}
.hero{background:linear-gradient(160deg,#0A2A5E 0%,#0B5DA7 70%,#1677D2 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 70px;position:relative}
.hero:after{content:'';position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06)}
.lift{margin-top:-52px;position:relative;z-index:2}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 8px 12px;text-align:center;cursor:pointer;box-shadow:0 2px 10px rgba(10,42,94,.04)}
.menu .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin:0 auto 8px}
.menu b{display:block;font-size:12px;line-height:1.2}
.menu small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.25}
.banner{border-radius:20px;padding:16px;background:linear-gradient(120deg,#0A2A5E,#114B8F);color:#fff;position:relative;overflow:hidden}
.banner .steps{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.banner .steps span{background:rgba(255,255,255,.12);border-radius:8px;padding:5px 8px;font-size:11px;font-weight:700;letter-spacing:.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:19px;color:var(--navy)}
.stat small{font-size:10.5px;color:var(--muted);line-height:1.2;display:block;margin-top:2px}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;font-size:11px;font-weight:600;display:block}
.cat .e{font-size:22px;display:block;margin-bottom:4px}
.opt input:checked+.cat{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.stepper{display:flex;gap:6px;margin-bottom:14px}
.stepper div{flex:1;height:5px;border-radius:5px;background:var(--line)}
.stepper div.on{background:var(--blue)}
.result{border-radius:20px;padding:18px;color:#fff}
.result.low{background:linear-gradient(135deg,#15803D,#22A055)}
.result.medium{background:linear-gradient(135deg,#C2410C,#EA7A12)}
.result.high{background:linear-gradient(135deg,#B01818,#E03A3A)}
.result .lv{font-size:22px;font-weight:800;letter-spacing:-.4px}
.meter{height:8px;background:rgba(255,255,255,.25);border-radius:8px;margin-top:12px;overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:8px}
ul.clean{list-style:none}
ul.clean li{display:flex;gap:9px;padding:6px 0;font-size:13px;line-height:1.45}
ul.clean li svg{flex-shrink:0;margin-top:2px}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding:16px}
.msg{max-width:84%;padding:11px 13px;border-radius:16px;font-size:13px;line-height:1.5;white-space:pre-line}
.msg.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.msg.ai,.msg.upg{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.upg{border-color:#BFD7F2;background:#F0F7FF}
.msg .src{display:block;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}
.msg .who{display:block;font-size:10.5px;font-weight:700;color:var(--blue);margin-bottom:3px}
.composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);flex-shrink:0}
.composer input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:11px 15px;outline:none}
.composer button{width:44px;height:44px;border-radius:50%;border:none;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:#9AB;animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.5}}
.cert{border:2px solid #C9A227;border-radius:18px;padding:22px 18px;text-align:center;background:linear-gradient(180deg,#FFFDF5,#fff)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:8px}
.spin{width:18px;height:18px;border:2.5px solid rgba(11,93,167,.25);border-top-color:var(--blue);border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.code{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:700;letter-spacing:3px;background:var(--sky);color:var(--navy);padding:12px;border-radius:12px;text-align:center}
.prof{width:56px;height:56px;border-radius:18px;background:var(--sky);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:19px}
.toggle{display:flex;background:var(--graybg);border-radius:12px;padding:4px}
.toggle button{flex:1;border:none;background:none;border-radius:9px;padding:9px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer}
.toggle button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hbar{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:8px}
.hbar span:first-child{width:92px;color:var(--muted);flex-shrink:0}
.hbar .bar{flex:1}
</style>
</head>

/* ---------- Rule Engine (parameter dari db.rules) ---------- */
function analyze(c){
  const R=db.rules,W=R.w;let s=0;const f=[];
  const p=PEMBERI.find(x=>x[0]===c.pemberi);const grp=p?p[2]:'lainnya';
  if(grp==='berkepentingan'){s+=W.berkepentingan;f.push(`Pemberi memiliki kepentingan dengan perusahaan/jabatan: ${p[1]} (+${W.berkepentingan})`)}
  else if(grp==='internal'&&W.internal){s+=W.internal;f.push(`Pemberi: ${p[1]} (+${W.internal})`)}
  else if(grp==='lainnya'&&W.lainnya){s+=W.lainnya;f.push(`Pemberi belum teridentifikasi jelas (+${W.lainnya})`)}
  if(c.kaitan==='ya'){s+=W.kaitanYa;f.push(`Pemberian berkaitan dengan pekerjaan/jabatan (+${W.kaitanYa})`)}
  else if(c.kaitan==='ragu'){s+=W.kaitanRagu;f.push(`Kaitan dengan jabatan belum dapat dipastikan (+${W.kaitanRagu})`)}
  const si=SITUASI.find(x=>x[0]===c.situasi);const sg=si?si[2]:'lainnya';
  if(sg==='keputusan'){s+=W.keputusan;f.push(`Diterima terkait proses layanan/keputusan yang melibatkan Anda (+${W.keputusan})`)}
  else if(sg==='perayaan'&&W.perayaan){s+=W.perayaan;f.push(`Diberikan pada momen hari raya/perayaan (+${W.perayaan})`)}
  if(R.setaraKas.includes(c.kat)){s+=W.setaraKas;f.push(`Bentuk pemberian setara kas: ${catName(c.kat)} (+${W.setaraKas})`)}
  if(Number(c.nilai)>Number(R.batasNilai)){s+=W.melebihiBatas;f.push(`Perkiraan nilai ${rp(c.nilai)} melebihi parameter ${rp(R.batasNilai)} (+${W.melebihiBatas})`)}
  if(c.status==='sudah'&&W.sudahDiterima){s+=W.sudahDiterima;f.push(`Pemberian sudah diterima (+${W.sudahDiterima})`)}
  const level=s>=R.cutHigh?'high':s>=R.cutMedium?'medium':'low';
  if(!f.length)f.push('Tidak ditemukan indikator kaitan pemberian dengan jabatan berdasarkan jawaban Anda');
  return {level,score:s,factors:f,versi:R.versi};
}
function recs(level,c){
  const H=db.sla.hariLapor;
  if(level==='low')return['Simpan hasil pengecekan sebagai catatan pribadi.','Tetap waspada bila di kemudian hari muncul permintaan imbal balik.','Jika masih ragu, konsultasikan dengan UPG.'];
  if(level==='medium')return['Konsultasikan dengan UPG sebelum memutuskan.','Dokumentasikan pemberian: foto, identitas pemberi, dan waktu.','Jangan gunakan atau konsumsi pemberian sampai ada arahan UPG.'];
  return[c.status==='belum'?'Tolak pemberian dengan sopan — pemberian belum diterima.':'Amankan pemberian dan jangan digunakan.','Laporkan kepada UPG melalui menu Lapor Gratifikasi.',`Laporkan dalam tenggat yang berlaku (parameter saat ini: ${H} hari kerja sejak diterima).`];
}

function need(f,vals,rules){const e={};for(const [n,m] of Object.entries(rules)){const v=vals[n];if(typeof m==='function'){const r=m(v,vals);if(r)e[n]=r}else if(!v||!String(v).trim())e[n]=m}ui.err[f]=e;return !Object.keys(e).length}

V.check=()=>{const c=ui.ck||(ui.ck={step:0});const st=c.step;

 let b='';
 if(st===0)b=`<div class="pad"><div class="banner"><div class="steps"><span>STOP</span><span>THINK</span><span>CHECK</span><span>ACT</span></div><div class="small" style="line-height:1.5;opacity:.9">Analisis awal risiko gratifikasi dalam 3 tahap: identifikasi pemberian, jawab pertanyaan, lihat hasil.</div></div>
  <div class="sec">Pilih cara pengecekan</div>
  <div class="item" data-a="ckMethod" data-v="scan"><div class="ic bl">${ic('camera',22)}</div><div class="grow"><div class="ttl">Scan dengan Kamera</div><div class="sub">Foto barang, AI Vision membantu mengenali jenisnya</div></div>${ic('chev',18)}</div>
  <div class="item mt8" data-a="ckMethod" data-v="manual"><div class="ic" style="background:#E9F7EF;color:var(--green)">${ic('edit',22)}</div><div class="grow"><div class="ttl">Input Manual</div><div class="sub">Pilih kategori dan isi informasi pemberian</div></div>${ic('chev',18)}</div>
  <div class="info mt16">${ic('info',14)} Hasil Gratify Check adalah <b>rekomendasi awal</b>, bukan keputusan hukum. Keputusan klasifikasi tetap menjadi kewenangan UPG.</div></div>`;
 if(st===1){const f='ck1';b=`<form class="pad" data-f="ck1">${stepper}<div class="h2">Tahap 1 — Identifikasi Pemberian</div>
  ${c.method==='scan'?`<div class="card mt12">${imgPick('ck','Foto pemberian')}
   ${c.aiBusy?`<div class="row mt12"><div class="spin"></div><span class="small">AI Vision menganalisis foto…</span></div>`:c.aiGuess?`<div class="info mt12"><b>Hasil identifikasi (simulasi):</b> ${catEmo(c.aiGuess)} ${catName(c.aiGuess)}<br><span class="tiny">Konfirmasi atau ubah kategori di bawah. AI Vision belum terhubung — adapter siap diaktifkan saat layanan tersedia.</span></div>`:`<button type="button" class="btn sec2 mt12" data-a="ckAI">${ic('scan',18)} Identifikasi dengan AI Vision</button>`}</div>`:''}
  ${fwrap(f,'kat','Kategori pemberian',1,`<div class="catgrid">${CATS.map(([v,t,e])=>`<div class="opt"><input type="radio" id="cat_${v}" name="kat" value="${v}" ${fv(f,'kat')===v?'checked':''}><label class="cat" for="cat_${v}"><span class="e">${e}</span>${t}</label></div>`).join('')}</div>`)}
  ${inp(f,'nama','Nama / deskripsi pemberian',{ph:'mis. Parsel buah dan kue kering'})}
  ${inp(f,'nilai','Perkiraan nilai (Rp)',{req:1,type:'number',ph:'0',attr:'inputmode="numeric" min="0"',hint:'Perkiraan harga pasar. Bila tidak tahu, isi perkiraan terdekat.'})}
  <div class="btns mt20"><button type="button" class="btn ghost" data-a="ckBack">Kembali</button><button class="btn">Lanjut</button></div></form>`}
 if(st===2){const f='ck2';b=`<form class="pad" data-f="ck2">${stepper}<div class="h2">Tahap 2 — Jawab Pertanyaan</div>
  ${sel(f,'pemberi','Siapa pemberinya?',PEMBERI.map(p=>[p[0],p[1]]),{req:1})}

  ${radios(f,'kaitan','Apakah pemberian berkaitan dengan pekerjaan atau jabatan Anda?',[['ya','Ya'],['tidak','Tidak'],['ragu','Ragu-ragu']],{req:1})}
  ${sel(f,'situasi','Dalam situasi apa pemberian diterima/ditawarkan?',SITUASI.map(s=>[s[0],s[1]]),{req:1})}

  <div class="btns mt20"><button type="button" class="btn ghost" data-a="ckBack">Kembali</button><button class="btn">Analisis</button></div></form>`}
 if(st===3){const r=c.result,L=LV[r.level];const pct=Math.min(100,Math.round(r.score/Math.max(db.rules.cutHigh+3,1)*100));
  b=`<div class="pad">${stepper}<div class="h2">Tahap 3 — Hasil Analisis</div>

  <div class="card mt12"><div class="h2">${r.level==='low'?'Alasan hasil analisis':r.level==='medium'?'Faktor risiko':'Indikator risiko'}</div><ul class="clean mt8">${r.factors.map(x=>`<li><span style="color:var(--${r.level==='low'?'green':r.level==='medium'?'orange':'red'})">${ic(r.level==='low'?'check':'alert',16)}</span>${esc(x)}</li>`).join('')}</ul></div>
  <div class="card mt12"><div class="h2">Rekomendasi tindakan</div><ul class="clean mt8">${recs(r.level,c).map(x=>`<li><span style="color:var(--blue)">${ic('chev',16)}</span>${esc(x)}</li>`).join('')}</ul></div>

  ${r.level==='low'?`<button class="btn green mt12" data-a="ckSave">${ic('check',18)} Simpan hasil pengecekan</button><button class="btn ghost mt8" data-a="ckKonsul">Tetap konsultasi ke UPG</button>`:''}
  ${r.level==='medium'?`<button class="btn orange mt12" data-a="ckKonsul">${ic('chat',18)} Konsultasi dengan UPG</button><button class="btn ghost mt8" data-a="ckLapor">${ic('flag',18)} Laporkan gratifikasi</button><button class="btn sec2 mt8" data-a="ckSave">Simpan hasil</button>`:''}
  ${r.level==='high'?`<button class="btn red mt12" data-a="ckLapor">${ic('flag',18)} Laporkan ke UPG</button><button class="btn ghost mt8" data-a="ckTolak">Lihat panduan menolak dengan sopan</button><button class="btn sec2 mt8" data-a="ckSave">Simpan hasil</button>`:''}
  <button class="btn ghost mt8" data-a="ckNew">${ic('refresh',18)} Cek pemberian lain</button></div>
  <div class="demo mt16">Hasil ini merupakan rekomendasi awal Rule Engine versi ${esc(r.versi)} (${esc(db.rules.validasi)}). Bukan keputusan final — keputusan klasifikasi gratifikasi tetap berada pada UPG.</div></div>`}
 return `${topbar('Gratify Check')}<div class="scroll">${b}</div>`};

 <div class="card mt12"><div class="h2">Laporan berdasarkan kategori</div>${Object.keys(byCat).length?Object.entries(byCat).map(([k,v])=>`<div class="hbar"><span>${esc(catName(k))}</span><div class="bar"><i style="width:${v/mx*100}%"></i></div><b>${v}</b></div>`).join(''):'<div class="sub mt8">Belum ada data.</div>'}</div>

/* ---------- Render ---------- */
function render(scrollTop){
  const [r,...args]=cur().split(':');
  if(!['splash','login','forgot'].includes(r)&&!me()){ui.stack=['login'];return render()}
  let h=V[r]?V[r](...args):'';
  if(h===null){ // draft → buka form
    const d=db.reports.find(x=>x.id===args[1]);ui.fv.lapor={tgl:d.tglTerima?d.tglTerima.slice(0,10):'',kat:d.kat,nilai:d.nilai,pemberi:d.pemberi,hubungan:d.hubungan,uraian:d.uraian,tindakan:d.tindakan};ui.img.lapor=d.foto;ui.files.lapor=d.dok;ui.draftId=d.id;ui.stack[ui.stack.length-1]='lapor';h=V.lapor()}
  let modal='';if(ui.modal)modal=`<div class="ov" data-a="closeModal"><div class="sheet" data-stop="1">${ui.modal}</div></div>`;
  const oldScroll=$('.scroll')?$('.scroll').scrollTop:0;
  $('#app').innerHTML=h+modal;
  const sc=$('.scroll');if(sc){if(r==='konsul')sc.scrollTop=sc.scrollHeight;else if(!scrollTop)sc.scrollTop=oldScroll}
  save();
}

  if(cur()==='konsul')render();else save()},700)}

  db.coi.push(c);audit('Mengirim deklarasi COI',c.no);upgIds().forEach(x=>notify(x,'Deklarasi COI baru',`${c.no} dari ${me().nama}`,'upg:coi:'+c.id));
  notify(me().id,'Deklarasi COI terkirim',`${c.no} menunggu persetujuan atasan.`,'coi');ui.fv.coi={};render(true)},
 klarif:v=>{if(!v.jawab||v.jawab.trim().length<5){ui.err.klarif={jawab:'Tulis tanggapan minimal 5 karakter'};return render()}
  const id=cur().split(':')[2];const r=db.reports.find(x=>x.id===id);r.status='Dalam Verifikasi';r.history.push({t:now(),status:'Dalam Verifikasi',by:me().nama,note:'Klarifikasi pelapor: '+v.jawab.trim()});
  audit('Mengirim klarifikasi',r.no);upgIds().forEach(x=>notify(x,'Klarifikasi diterima',`${r.no}: pelapor telah mengirim klarifikasi.`,'upg:grt:'+r.id));toast('Klarifikasi terkirim');render()},
 upgStatus:(v,form)=>{const {type,id}=form.dataset;if(!v.status){ui.err.upgStatus={status:'Pilih status baru'};return render()}
  if(v.status==='Memerlukan Klarifikasi'&&!(v.note||'').trim()){ui.err.upgStatus={status:'Tuliskan klarifikasi yang diminta pada kolom catatan'};return render()}
  ui.err.upgStatus={};const by=me().nama+' (UPG)';const note=(v.note||'').trim()+((ui.files.telaah||[]).length?` [Lampiran: ${ui.files.telaah.join(', ')}]`:'');
  if(type==='grt'){const r=db.reports.find(x=>x.id===id);r.status=v.status;r.history.push({t:now(),status:v.status,by,note});audit('Mengubah status → '+v.status,r.no);
   notify(r.userId,v.status==='Memerlukan Klarifikasi'?'Permintaan klarifikasi':'Status laporan diperbarui',`${r.no} kini ${v.status}.${v.status==='Memerlukan Klarifikasi'?' Mohon tanggapi.':''}`,'grt:'+r.id)}
  if(type==='wbs'){const w=db.wbs.find(x=>x.id===id);w.status=v.status;w.history.push({t:now(),status:v.status,note});audit('Investigator mengubah status → '+v.status,w.no);if(w.userId)notify(w.userId,'Status WBS diperbarui',`${w.no} kini ${v.status}.`,'wbs:'+w.id)}
  if(type==='coi'){const c=db.coi.find(x=>x.id===id);c.status=v.status;c.history.push({t:now(),status:v.status,by:v.status==='Disetujui Atasan'?c.atasan+' (atasan – simulasi)':by,note});audit('Mengubah status COI → '+v.status,c.no);notify(c.userId,'Status deklarasi COI',`${c.no} kini ${v.status}.`,'coi')}
  ui.files.telaah=[];toast('Tindakan tersimpan');render()},
 upgReply:(v,form)=>{if(!v.m||!v.m.trim()){ui.err.upgReply={m:'Tulis jawaban'};return render()}ui.err.upgReply={};const k=db.consults.find(x=>x.id===form.dataset.id);
  k.msgs.push({from:'upg',text:v.m.trim(),t:now()});k.status='Dijawab UPG';audit('Menjawab konsultasi',k.no);notify(k.userId,'UPG menjawab konsultasi Anda',`${k.no}: ketuk untuk membaca jawaban.`,'kon:'+k.id);render()},
 rules:v=>{const N=k=>{const x=Number(v[k]);return isNaN(x)||x<0?0:x};const R=db.rules;
  if(N('cutHigh')<=N('cutMedium')){toast('Skor HIGH harus lebih besar dari MEDIUM');return}
  R.batasNilai=N('batasNilai');Object.keys(R.w).forEach(k=>R.w[k]=N('w_'+k));R.cutMedium=N('cutMedium');R.cutHigh=N('cutHigh');R.setaraKas=CATS.map(c=>c[0]).filter(c=>v['sk_'+c]);
  db.sla.hariLapor=Math.max(1,N('hariLapor'));db.sla.hariVerifikasi=Math.max(1,N('hariVerifikasi'));
  const n=parseInt((R.versi.match(/\d+$/)||['1'])[0])+1;R.versi='Demo-'+String(n).padStart(2,'0');R.diperbarui=now();R.validasi=v.validasi?'Divalidasi oleh '+me().nama:'Belum divalidasi UPG (parameter contoh)';
  audit('Memperbarui parameter Rule Engine → '+R.versi,'Rule Engine');toast('Parameter disimpan sebagai versi '+R.versi);render(true)}
};

/* ---------- Event delegation ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;
  if(el.classList.contains('ov')&&e.target!==el)return; // klik di dalam sheet
  const form=el.closest('form');if(form&&form.dataset.f)ui.fv[form.dataset.f]={...(ui.fv[form.dataset.f]||{}),...formVals(form)};
  const a=el.dataset.a;if(a==='closeModal'){ui.modal=null;render();return}
  if(A[a]){e.preventDefault();A[a](el.dataset.v,el,e)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;const fn=F[f.dataset.f];if(fn)fn(formVals(f),f)});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.img&&el.files[0]){const key=el.dataset.img;const file=el.files[0];const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const m=640,sc=Math.min(1,m/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);ui.img[key]=cv.toDataURL('image/jpeg',.72);const p=$('#prev-'+key);if(p)p.innerHTML=`<img class="thumb" src="${ui.img[key]}">`;if(key==='ck'&&ui.ck){ui.ck.aiGuess=null}};img.onerror=()=>toast('Format gambar tidak didukung');img.src=ev.target.result};r.readAsDataURL(file)}
  if(el.dataset.files){const key=el.dataset.files;const max=10*1024*1024;const ok=[...el.files].filter(f=>{if(f.size>max){toast(f.name+' melebihi 10 MB');return false}return true}).map(f=>f.name);ui.files[key]=[...(ui.files[key]||[]),...ok];const p=$('#files-'+key);if(p)p.innerHTML=ui.files[key].map(n=>'📎 '+esc(n)).join('<br>')}
});

/* ---------- Session timeout (15 menit) ---------- */
let idle=Date.now();['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>idle=Date.now(),{passive:true}));
setInterval(()=>{if(me()&&Date.now()-idle>15*60*1000){audit('Sesi berakhir (timeout)','-');session=null;ui.stack=['login'];ui.modal=`<div class="h2">Sesi berakhir</div><div class="sub mt8">Anda keluar otomatis setelah 15 menit tanpa aktivitas demi keamanan data.</div><button class="btn mt16" data-a="closeModal">Masuk kembali</button>`;render()}},30000);

/* ---------- Start ---------- */
render();
setTimeout(()=>{if(cur()==='splash')reset(me()?(me().role==='upg'?'upgHome':'home'):'login')},1500);
</script>
